name: Build SANCI Kernel HyperOS A15 KSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
          git wget curl zip unzip \
          bc bison flex cpio kmod \
          build-essential libssl-dev libelf-dev \
          python3 python3-pip \
          clang lld llvm

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang.git \
          clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
          https://github.com/osm0sis/AnyKernel3.git \
          AnyKernel3

      - name: Clone Magisk
        run: |
          git clone --depth=1 \
          https://github.com/topjohnwu/Magisk.git

      - name: Setup KernelSU Next
        run: |
          curl -LSs \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Enable KernelSU Configs
        run: |
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/vendor/vayu-perf_defconfig
          echo 'CONFIG_KPROBES=y' >> arch/arm64/configs/vendor/vayu-perf_defconfig
          echo 'CONFIG_HAVE_KPROBES=y' >> arch/arm64/configs/vendor/vayu-perf_defconfig
          echo 'CONFIG_KALLSYMS=y' >> arch/arm64/configs/vendor/vayu-perf_defconfig
          echo 'CONFIG_KALLSYMS_ALL=y' >> arch/arm64/configs/vendor/vayu-perf_defconfig
          echo 'CONFIG_LOCALVERSION="-SANCI"' >> arch/arm64/configs/vendor/vayu-perf_defconfig

      - name: Extract Prebuilt Files
        run: |
          mkdir -p prebuilt

          unzip prebuilt/boot.zip -d prebuilt/

          if [ -f prebuilt/dtbo.zip ]; then
            unzip prebuilt/dtbo.zip -d prebuilt/
          fi

          ls -lah prebuilt/

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            vayu_defconfig

          yes | make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1

      - name: Check Build Output
        run: |
          echo "========== BUILD OUTPUT =========="
          ls -lah out/arch/arm64/boot/

      - name: Prepare Boot Repack
        run: |
          mkdir repack

          cp prebuilt/boot.img repack/

          cd repack

          python3 ../Magisk/scripts/unpack_bootimg.py boot.img || true

          if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../out/arch/arm64/boot/Image.gz-dtb kernel
          elif [ -f ../out/arch/arm64/boot/Image.gz ]; then
            cp ../out/arch/arm64/boot/Image.gz kernel
          else
            echo "Kernel image not found"
            exit 1
          fi

      - name: Repack Boot Image
        run: |
          cd repack

          python3 ../Magisk/scripts/repack_bootimg.py boot.img || true

          if [ -f new-boot.img ]; then
            mv new-boot.img ../SANCI-boot.img
          else
            echo "Boot repack failed"
            exit 1
          fi

      - name: Configure AnyKernel3
        run: |
          cat > AnyKernel3/anykernel.sh << 'EOF'
          #!/sbin/sh

          properties() { '
          kernel.string=SANCI Kernel HyperOS A15 KSU Next
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vayu
          device.name2=bhima
          supported.versions=
          supported.patchlevels=
          '; }

          block=auto
          is_slot_device=auto
          ramdisk_compression=auto

          . tools/ak3-core.sh

          dump_boot

          write_boot
          EOF

      - name: Prepare AnyKernel
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            echo "Kernel image missing"
            exit 1
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../SANCI-Kernel-HyperOS-A15-KSUNext.zip *

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: SANCI-BootImage
          path: SANCI-boot.img

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SANCI-Kernel-HyperOS-A15-KSUNext
          path: SANCI-Kernel-HyperOS-A15-KSUNext.zip
